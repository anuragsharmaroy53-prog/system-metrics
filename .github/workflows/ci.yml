name: System Metrics CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python code
        run: |
          python -m py_compile backend/app.py

      - name: Build backend Docker image
        run: |
          docker build -t system-metrics-backend ./backend

      - name: Build frontend Docker image
        run: |
          docker build -t system-metrics-frontend ./frontend

      - name: Build application with Docker Compose
        run: |
          docker compose build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag backend image
        run: |
          docker tag system-metrics-backend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/system-metrics-backend:latest

      - name: Tag frontend image
        run: |
          docker tag system-metrics-frontend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/system-metrics-frontend:latest

      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/system-metrics-backend:latest

      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/system-metrics-frontend:latest
